[package]
name = "panic-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# M36 (docs/plan-panic-recovery.md): an application that can panic at each
# of the sites a frame runs application code (twelve since M90/T90.6), chosen by number. The
# library is what the headless tests drive; the binary is what T36.0 runs
# as a subprocess to record that today each site kills the process.
[dependencies]
fulgurite = { path = "../../crates/fulgurite" }
fulgurite-widgets = { path = "../../crates/fulgurite-widgets" }
fulgurite-shell = { path = "../../crates/fulgurite-shell" }
# The window mode (M36/T36.3), off by default so the headless binary
# T36.0 runs is exactly the unguarded one.
fulgurite-winit = { path = "../../crates/fulgurite-winit", optional = true }

[features]
default = []
window = ["dep:fulgurite-winit"]
agent = ["window", "fulgurite-winit/agent", "fulgurite-widgets/observe"]
reload = ["window", "fulgurite-winit/reload"]
# M55/T55.4: run the window under `Everything` -- selected in `main`,
# not forwarded (the window crate has no such feature any more).
everything = ["window"]
