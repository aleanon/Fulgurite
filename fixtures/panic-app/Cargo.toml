[package]
name = "panic-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# M36 (docs/plan-panic-recovery.md): an application that can panic at each
# of the seven sites a frame runs application code, chosen by number. The
# library is what the headless tests drive; the binary is what T36.0 runs
# as a subprocess to record that today each site kills the process.
[dependencies]
lumen-static = { path = "../../crates/lumen-static" }
lumen-static-widgets = { path = "../../crates/lumen-static-widgets" }
lumen-static-shell = { path = "../../crates/lumen-static-shell" }
# The window mode (M36/T36.3), off by default so the headless binary
# T36.0 runs is exactly the unguarded one.
lumen-static-winit = { path = "../../crates/lumen-static-winit", optional = true }

[features]
default = []
window = ["dep:lumen-static-winit"]
agent = ["window", "lumen-static-winit/agent", "lumen-static-widgets/observe"]
reload = ["window", "lumen-static-winit/reload"]
# M55/T55.4: run the window under `Everything` -- selected in `main`,
# not forwarded (the window crate has no such feature any more).
everything = ["window"]
