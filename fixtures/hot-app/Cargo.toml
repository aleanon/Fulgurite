[package]
name = "hot-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[features]
# The "edited code": different footer text and Default theme, and the
# Mode::Fancy variant is deleted.
v2 = []
# M36/T36.4: the v2 code with a frame that panics, and the v2 code again
# with it fixed. The loader catches the first and carries on with the
# second; the fix draws exactly v2's frame.
v3 = ["v2"]
v4 = ["v2"]

[dependencies]
fulgurite-widgets = { path = "../../crates/fulgurite-widgets", features = ["reload"] }
fulgurite = { path = "../../crates/fulgurite", features = ["reload"] }
fulgurite-reload = { path = "../../crates/fulgurite-reload" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
