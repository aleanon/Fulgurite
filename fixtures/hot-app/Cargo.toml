[package]
name = "hot-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[features]
# The "edited code": different footer text and Default theme, and the
# Mode::Fancy variant is deleted.
v2 = []

[dependencies]
lumen-static-widgets = { path = "../../crates/lumen-static-widgets", features = ["reload"] }
lumen-static = { path = "../../crates/lumen-static", features = ["reload"] }
lumen-static-reload = { path = "../../crates/lumen-static-reload" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
