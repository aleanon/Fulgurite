[package]
name = "binsize"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Code-size comparison: two binaries doing the same work over the same
# 90-node shape, one per path. No dev-dependencies, no features.
[dependencies]
fulgurite-widgets = { path = "../../crates/fulgurite-widgets" }
fulgurite = { path = "../../crates/fulgurite" }


[[bin]]
name = "binsize"
path = "src/bin/binsize.rs"
