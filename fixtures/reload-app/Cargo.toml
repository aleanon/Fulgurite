[package]
name = "reload-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# M37/T37.1: a window library -- a `program()` behind `export_program!`.
# `scripts/window_reload_demo.sh` builds it as v1 and v2 (the bound
# label's format changes, the kept count must not) and `fixtures/
# reload-host` swaps between them headlessly.
[lib]
crate-type = ["cdylib"]

[features]
v2 = []
# T37.3: v2's code, with the kept `name` changed from `String` to `u32`.
v3 = ["v2"]
# M49/T49.0: v3, whose boot panics -- the swap must not happen (R4-F5).
panic-boot = ["v3"]
# M49/T49.7: v3, whose kept `Tally` gained a field -- the count must survive.
grow = ["v3"]
# M49/T49.11: `grow`, with a label added before `#value` -- the tree's
# shape changes, so node indices shift and the swap must say so.
v4 = ["grow"]

[dependencies]
fulgurite = { path = "../../crates/fulgurite", features = ["reload"] }
fulgurite-widgets = { path = "../../crates/fulgurite-widgets", features = ["reload"] }
fulgurite-shell = { path = "../../crates/fulgurite-shell", features = ["truetype", "reload"] }
fulgurite-reload = { path = "../../crates/fulgurite-reload", features = ["window"] }
serde = { version = "1", features = ["derive"] }
