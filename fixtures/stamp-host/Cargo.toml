[package]
name = "stamp-host"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
fulgurite = { path = "../../crates/fulgurite", features = ["reload"] }
fulgurite-reload = { path = "../../crates/fulgurite-reload" }
libloading = "0.8"
# M81/T81.1: compare with the shell's fields too (`session::abi_fields`),
# as a window's loader does; `shaping` builds the loader with the shell's
# shaper, for the accepting half of the pair.
fulgurite-shell = { path = "../../crates/fulgurite-shell", features = ["truetype", "reload"], optional = true }

[features]
shell = ["dep:fulgurite-shell"]
shaping = ["shell", "fulgurite-shell/shaping"]
# M83/T83.3: the two shader entries (`session::abi_fields`). `shader-core`
# turns the core's `shader` on with the shell's off -- the build where only
# `fulgurite_shader` (the core's variant set, read through the shell's
# `build.rs`) tells it apart; `shader` turns the shell's on as well.
shader-core = ["shell", "fulgurite/shader"]
shader = ["shader-core", "fulgurite-shell/shader"]
