[package]
name = "embedded"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# `default-features = false` and nothing else: the **leaf** tier, no `std`
# and no allocator -- stricter than the M13 device's `alloc` shape
# (docs/plan-embedded.md T13.0), and the tier every firmware below is
# measured in. Until M52/T52.1 this comment said `features = ["alloc"]`,
# which the dependency line below does not ask for.
# The lib half of this crate is `#![no_std]` and is checked for
# thumbv7em-none-eabihf by `just thumb`; the `embedded` bin runs on the
# host under an aborting allocator. The `firmware*` bins are real thumb
# links, with a #[panic_handler] and an entry symbol but no board.
[dependencies]
lumen-static = { path = "../../crates/lumen-static", default-features = false }
# **M30.** The widgets moved out of the core, so the leaf profile names
# this crate to get a button. That is the split working as its own
# Cargo.toml argues it — "an application opts in by naming this crate" —
# and it is why the crate had to be made `no_std`-capable first: it
# offered an `alloc` tier that could never build.
lumen-static-widgets = { path = "../../crates/lumen-static-widgets", default-features = false }

# The T13.7 gate re-rasterises the baked face and compares every byte.
# `fontdue` is a dev-dependency here and only here: it is the thing the
# target cannot have, which is why the face is baked in the first place.
[dev-dependencies]
fontdue = "0.9"

[lib]
name = "embedded"
path = "src/lib.rs"

[[bin]]
name = "embedded"
path = "src/main.rs"

# The linked thumb binary T13.9 measures. `required-features` keeps it
# out of every host build: it defines `#[panic_handler]`, which is a
# duplicate lang item wherever std is linked, so `cargo test --workspace`
# would fail on it. `just firmware-size` turns the feature on.
[[bin]]
name = "firmware"
path = "src/bin/firmware.rs"
required-features = ["firmware"]

# M52: the three binaries the firmware gates also read (T52.1). The
# paint-only one above lays out and paints; these dispatch, bind and
# cascade, which is what a device does and what M29 and M33 grew with
# every gate green (R11-F4). `scripts/lib/firmware.sh` builds all four in
# one cargo call; `check_text.sh` and `check_bss.sh` judge each, and
# docs/results-embedded.md has their figures.
[[bin]]
name = "firmware_interactive"
path = "src/bin/firmware_interactive.rs"
required-features = ["firmware"]

[[bin]]
name = "firmware_bind"
path = "src/bin/firmware_bind.rs"
required-features = ["firmware"]

[[bin]]
name = "firmware_cascade"
path = "src/bin/firmware_cascade.rs"
required-features = ["firmware"]

[features]
firmware = []
