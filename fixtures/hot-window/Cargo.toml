[package]
name = "hot-window"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# M37/T37.4: a window that reloads itself. `scripts/hot_window_drive.sh`
# copies this crate into a workspace of its own under target/, runs it
# with `--features hot,agent`, and edits the COPY's source with `sed` --
# never this checked-in one. Its library is `program()` behind
# `export_program!`; its binary is `program().run()`.

# M49/T49.9: `hot` turns the reload surface on, and nothing else does. The
# `Reloadable` derive expands to nothing without the core's `reload`, so a
# build without `hot` carries no serde_json and no reload crate at all
# (`just reload-gating` counts it). It used to enable `reload` on every
# dependency unconditionally, because the derive did not build without it.
# ANCHOR: features
[features]
hot = [
    "fulgurite-winit/hot",
    "fulgurite/reload",
    "fulgurite-widgets/reload",
    "fulgurite-shell/reload",
    "dep:fulgurite-reload",
]
agent = ["fulgurite-winit/agent", "fulgurite-widgets/observe"]
# ANCHOR_END: features
# M81/T81.4: `Shaping::Complex` for the drive's shaping step -- the loader
# and the library both build with it, and `--expect-features` names it.
shaping = ["fulgurite-winit/shaping", "fulgurite-shell/shaping"]
# M83/T83.8: `#swatch` becomes a `ShaderView` and the program registers its
# table, so the drive's GPU legs can edit the copy's WGSL and watch the swap
# re-send it (`--features hot,agent,gpu,shader`). Default-off: a member's
# features unify into every `--workspace` build.
shader = ["fulgurite-widgets/shader", "fulgurite-shell/shader", "fulgurite-winit/shader"]
gpu = ["fulgurite-winit/gpu"]
# M89/T89.7: both programs under `Everything`, so the drive's windows leg
# runs both strategies (the shaping legs edit `EDIT strategy` instead).
everything = []

[dependencies]
fulgurite = { path = "../../crates/fulgurite" }
fulgurite-widgets = { path = "../../crates/fulgurite-widgets" }
fulgurite-shell = { path = "../../crates/fulgurite-shell", features = ["truetype"] }
fulgurite-reload = { path = "../../crates/fulgurite-reload", features = ["window"], optional = true }
fulgurite-winit = { path = "../../crates/fulgurite-winit" }
serde = { version = "1", features = ["derive"] }
