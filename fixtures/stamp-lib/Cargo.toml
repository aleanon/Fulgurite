[package]
name = "stamp-lib"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# M37/T37.0: a library whose only job is to describe how it was built.
# `scripts/abi_stamp.sh` builds it twice -- as the loader was built, and
# with the core's `observe` on -- and the loader must accept the first
# and refuse the second by name.
[lib]
crate-type = ["cdylib"]

[features]
# The widgets' too, since M48/T48.9: the widgets crate refuses to build
# with the core's `observe` on and its own off.
observe = ["fulgurite/observe", "fulgurite-widgets/observe"]
# M81/T81.1: stamp with the shell's fields too (`session::abi_fields`), as
# a window library does, so the shell's feature list can be shown to
# refuse: `shaping` is the first shell feature `just abi-stamp` pairs.
shell = ["dep:fulgurite-shell"]
shaping = ["shell", "fulgurite-shell/shaping"]
# M83/T83.3: the two shader entries (`session::abi_fields`). `shader-core`
# turns the core's `shader` on with the shell's off -- the build where only
# `fulgurite_shader` (the core's variant set, read through the shell's
# `build.rs`) tells it apart; `shader` turns the shell's on as well.
shader-core = ["shell", "fulgurite/shader"]
shader = ["shader-core", "fulgurite-shell/shader"]
# M84/T84.6 (review A25): the shell's `image` is NOT in the stamp -- the
# application's store crosses only as `&dyn ImageSource`, a core trait the
# source hash covers -- so a library built with it is ACCEPTED by a loader
# built without (`just abi-stamp` asserts it).
image = ["shell", "fulgurite-shell/image"]

[dependencies]
fulgurite = { path = "../../crates/fulgurite", features = ["reload"] }
fulgurite-reload = { path = "../../crates/fulgurite-reload" }
# M49/T49.1: in the graph so an edit to it alone can be shown to be accepted.
fulgurite-widgets = { path = "../../crates/fulgurite-widgets" }
fulgurite-shell = { path = "../../crates/fulgurite-shell", features = ["truetype", "reload"], optional = true }
