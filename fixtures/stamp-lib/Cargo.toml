[package]
name = "stamp-lib"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# M37/T37.0: a library whose only job is to describe how it was built.
# `scripts/abi_stamp.sh` builds it twice -- as the loader was built, and
# with the core's `observe` on -- and the loader must accept the first
# and refuse the second by name.
[lib]
crate-type = ["cdylib"]

[features]
# The widgets' too, since M48/T48.9: the widgets crate refuses to build
# with the core's `observe` on and its own off.
observe = ["lumen-static/observe", "lumen-static-widgets/observe"]

[dependencies]
lumen-static = { path = "../../crates/lumen-static", features = ["reload"] }
lumen-static-reload = { path = "../../crates/lumen-static-reload" }
# M49/T49.1: in the graph so an edit to it alone can be shown to be accepted.
lumen-static-widgets = { path = "../../crates/lumen-static-widgets" }
