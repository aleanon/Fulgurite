[package]
name = "observe-probe"
version = "0.0.0"
edition = "2021"
publish = false

# M35/T35.0 (`docs/plan-observe-cost.md`): two row containers, one binary
# each, so `scripts/check_observe_inlining.sh` can ask the symbol table
# whether compiling `observe` in stops the row widget's `layout` and
# `paint` being inlined into its container's loop. Built with this
# workspace's release profile (LTO, one codegen unit), unstripped by the
# script, plain and with `observe`.
[dependencies]
fulgurite = { path = "../../../crates/fulgurite" }
fulgurite-widgets = { path = "../../../crates/fulgurite-widgets" }
fulgurite-shell = { path = "../../../crates/fulgurite-shell" }

[features]
observe = ["fulgurite/observe", "fulgurite-widgets/observe"]
# M54/T54.1: the screen-reader tree alone, which carries the static walk.
a11y = ["fulgurite/a11y", "fulgurite-widgets/a11y"]
