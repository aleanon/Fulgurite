[package]
name = "vello-cpu-arm"
version = "0.0.0"
edition = "2021"
publish = false

# Both renderers in ONE binary, over one scene, built once. Two binaries
# would reintroduce exactly the confound `docs/results-wide-stores.md`
# records: a difference in what the optimiser could see, reported as a
# difference in what the code costs.
[dependencies]
fulgurite = { path = "../../../crates/fulgurite" }
fulgurite-shell = { path = "../../../crates/fulgurite-shell", features = ["truetype"] }
# The comparison. `multithreading` is a *runtime* setting in vello_cpu
# (`RenderSettings::num_threads`), so one build sweeps both, where the
# fulgurite arm needs two builds because `threads` is a cargo feature.
vello_cpu = { version = "0.2", features = ["multithreading", "text", "u8_pipeline"] }
# The same face, and the same advances, feed both sides -- see `run_glyphs`.
fontdue = "0.9"

[features]
default = []
simd = ["fulgurite-shell/simd"]
threads = ["fulgurite-shell/threads"]
