[package]
name = "raster-scaling"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
fulgurite = { path = "../../../crates/fulgurite" }
fulgurite-shell = { path = "../../../crates/fulgurite-shell", features = ["truetype"] }
# The GPU arm. This is a benchmark workspace of its own, so pulling wgpu
# here costs the framework's dependency graph nothing.
fulgurite-wgpu = { path = "../../../crates/fulgurite-wgpu" }

# Passed through so the rasteriser's SIMD path can be measured on the
# same workload as the scalar one (M17, docs/results-simd.md).
[features]
default = []
simd = ["fulgurite-shell/simd"]
threads = ["fulgurite-shell/threads"]
