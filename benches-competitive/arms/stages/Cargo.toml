[package]
name = "fulgurite-stages"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
fulgurite-widgets = { path = "../../../crates/fulgurite-widgets" }
fulgurite = { path = "../../../crates/fulgurite" }
# `truetype`, for the same reason the frame arm takes it: every stage
# number here is dominated by text, and measuring against the
# half-em-per-byte stand-in would report arithmetic where the shipped
# build shapes glyphs.
fulgurite-shell = { path = "../../../crates/fulgurite-shell", features = ["truetype"] }
# The GPU raster stage. This is a benchmark workspace of its own, so
# pulling wgpu here costs the framework's dependency graph nothing --
# the same argument the raster arm's manifest makes.
fulgurite-wgpu = { path = "../../../crates/fulgurite-wgpu" }

# Passed through so the rasteriser's SIMD path can be measured on the
# same workload as the scalar one (M17, docs/results-simd.md).
[features]
default = []
simd = ["fulgurite-shell/simd"]
