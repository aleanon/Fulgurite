[package]
name = "fulgurite-frame"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
# **Not `features = ["observe"]` here.** M30 put it on this line, which
# compiled the widgets' `probe`/`observe` methods into the PLAIN arm and
# slowed its frame (bisected to 6052492; the figures and the cause are in
# `docs/results-competitive.md` §7, which owns them). The whole point of the
# two arms is that one of them is observe-free, so the feature belongs
# in the `observe` feature below, beside the other two.
fulgurite-widgets = { path = "../../../crates/fulgurite-widgets" }
fulgurite = { path = "../../../crates/fulgurite" }
# `truetype` deliberately: every other arm shapes text for real, and measuring
# this one against the half-em-per-byte stand-in would compare fontdue shaping
# to arithmetic.
fulgurite-shell = { path = "../../../crates/fulgurite-shell", features = ["truetype"] }
# The dev surface, so the harness can measure BOTH profiles: `observe` turns
# on the agent's per-frame journal and ambient audit, which is the right
# default for `cargo run` and the wrong thing to compare against Qt and GTK,
# which run no such pass. Lumen's harness draws the same line and for the same
# reason (its BENCH5 note).
fulgurite-agent = { path = "../../../crates/fulgurite-agent", optional = true }

[features]
# Passed through so the rasteriser's SIMD path can be measured on the
# same workload as the scalar one (M17, docs/results-simd.md). The
# cross-arm rows stop before rasterising, so this cannot move them.
simd = ["fulgurite-shell/simd"]
# M81/T81.1: the shell's default-off shaper, forwarded so K3's frame rows
# can be measured with it compiled in and `Basic` selected
# (docs/plan-shaped-paint.md, K3 for this milestone).
shaping = ["fulgurite-shell/shaping"]
default = []
observe = ["dep:fulgurite-agent", "fulgurite/observe", "fulgurite-widgets/observe"]
