[package]
name = "benches"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
lumen-static = { path = "../crates/lumen-static" }
lumen-static-agent = { path = "../crates/lumen-static-agent" }
# T7.3 measures the memo against the *real* measurer; the stand-in cannot
# answer what the memo is worth (docs/text-render-adoption-decision.md).
lumen-static-shell = { path = "../crates/lumen-static-shell", features = ["truetype"] }
# M26/T26.0: `Badge` and `Chip` shape on every layout with no memo at all
# (M26/T26.8), and the memo arms live here — so the widgets that lack one
# have to be measurable beside the ones that have it.
lumen-static-widgets = { path = "../crates/lumen-static-widgets" }

[features]
rdyn_opaque = ["lumen-static/rdyn_opaque"]
# M25/T25.12: which variant `--bin appearance` is built against. None is
# `main`; `look` is the pilot (a look resolved on every layout); `cached`
# is the pilot with its look cached, and adds the palette generation.
look = []
cached = ["look"]

[[bin]]
name = "glass-cost"
path = "src/bin/glass_cost.rs"

[[bin]]
name = "crossover"
path = "src/bin/crossover.rs"



[[bin]]
name = "retain"
path = "src/bin/retain.rs"

[[bin]]
name = "bindings"
path = "src/bin/bindings.rs"

[[bin]]
name = "paint_sink"
path = "src/bin/paint_sink.rs"

[[bin]]
name = "cascade"
path = "src/bin/cascade.rs"

[[bin]]
name = "agent"
path = "src/bin/agent.rs"

[[bin]]
name = "appearance"
path = "src/bin/appearance.rs"
