[package]
name = "benches"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
fulgurite = { path = "../crates/fulgurite" }
# Optional since M35/T35.0: see the `observe` feature.
fulgurite-agent = { path = "../crates/fulgurite-agent", optional = true }
# T7.3 measures the memo against the *real* measurer; the stand-in cannot
# answer what the memo is worth (docs/text-render-adoption-decision.md).
fulgurite-shell = { path = "../crates/fulgurite-shell", features = ["truetype"] }
# M26/T26.0: `Badge` and `Chip` shape on every layout with no memo at all
# (M26/T26.8), and the memo arms live here — so the widgets that lack one
# have to be measurable beside the ones that have it.
fulgurite-widgets = { path = "../crates/fulgurite-widgets" }

[features]
# M50/T50.4: `--bin banded_pool` measures the threaded rasteriser.
threads = ["fulgurite-shell/threads"]
# M81/T81.1: the shell's default-off shaper, so K3's arms can be run with
# it compiled in and `Basic` selected, and T81.3's `--shaping` rows built.
shaping = ["fulgurite-shell/shaping"]
# M82/T82.8: K82e's arm of `--bin vocabulary` -- a `VectorText` drawn from
# outlines, which the shell's measurer answers only under its default-off
# `vector-text`. Off by default, so K3's arms build as before.
vector-text = ["fulgurite-shell/vector-text"]
# M84/T84.8: K84e's `--bin video_rate` plays a `GifFeed`, which is behind
# the shell's default-off `image`.
image = ["fulgurite-shell/image"]
# **Default-on, and optional since M35/T35.0** (`docs/plan-observe-cost.md`).
# It was unconditional, so no bench here could be built without the
# widgets' observability compiled in — and `--bin grid` could not say what
# an application pays for it. `--no-default-features` builds without it;
# `--bin agent` requires it.
default = ["observe"]
observe = ["dep:fulgurite-agent", "fulgurite-widgets/observe"]
rdyn_opaque = ["fulgurite/rdyn_opaque"]
# M25/T25.12: which variant `--bin appearance` is built against. None is
# `main`; `look` is the pilot (a look resolved on every layout); `cached`
# is the pilot with its look cached, and adds the palette generation.
look = []
cached = ["look"]

[[bin]]
name = "glass-cost"
path = "src/bin/glass_cost.rs"

[[bin]]
name = "crossover"
path = "src/bin/crossover.rs"



[[bin]]
name = "retain"
path = "src/bin/retain.rs"

[[bin]]
name = "bindings"
path = "src/bin/bindings.rs"

[[bin]]
name = "paint_sink"
path = "src/bin/paint_sink.rs"

[[bin]]
name = "cascade"
path = "src/bin/cascade.rs"

[[bin]]
name = "agent"
path = "src/bin/agent.rs"
required-features = ["observe"]

[[bin]]
name = "appearance"
path = "src/bin/appearance.rs"

[[bin]]
name = "text-hash"
path = "src/bin/text_hash.rs"

# M47/T47.3's kill rule: a no-op job from spawn to apply, pool against a
# thread per job (docs/results-tasks.md T47.3).
[[bin]]
name = "spawn"
path = "src/bin/spawn.rs"

# M50/T50.4: the persistent-pool probe's kill rule, against the scoped
# banded frame (`docs/plan-raster-allocation.md` §2.2, §5).
[[bin]]
name = "video_rate"
path = "src/bin/video_rate.rs"
required-features = ["image"]

[[bin]]
name = "banded_pool"
path = "src/bin/banded_pool.rs"
required-features = ["threads"]

# M82/T82.2: what a gradient costs on the software canvas, by shape --
# linear, radial and rounded radial, in ns per Mpx
# (docs/results-paint-vocabulary.md). T82.5 and T82.8 add arms.
[[bin]]
name = "vocabulary"
path = "src/bin/vocabulary.rs"
