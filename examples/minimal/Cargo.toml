[package]
name = "minimal"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
fulgurite-widgets = { path = "../../crates/fulgurite-widgets" }
fulgurite = { path = "../../crates/fulgurite" }
fulgurite-winit = { path = "../../crates/fulgurite-winit" }

# Passed straight through, so the same 24-line application can be built
# both ways and the difference measured rather than asserted
# (docs/results-gpu.md). `cargo run -p minimal --features gpu`, and
# `FULGURITE_BACKEND=software` to make it fall back on purpose.
[features]
default = []
gpu = ["fulgurite-winit/gpu"]
