[package]
name = "counter-window"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The tally, in a window — **the framework's window** since M60
# (`docs/plan-tally-slim.md`): `Program::run` owns the loop, the agent
# endpoint, the a11y adapter and the frame timings. This crate is the
# application and its headless drives.
[dependencies]
fulgurite-widgets = { path = "../../crates/fulgurite-widgets", features = ["observe"] }
fulgurite = { path = "../../crates/fulgurite" }
# `agent`: the endpoint on 127.0.0.1:9230 (`Program::agent`), which every
# live drive of the tally dials.
fulgurite-winit = { path = "../../crates/fulgurite-winit", features = ["agent"] }
# `live-agent`: `--drive` and `--drive2` drive a `Local` session through
# the same `Session::agent` the window answers with.
fulgurite-shell = { path = "../../crates/fulgurite-shell", features = ["truetype", "live-agent"] }
fulgurite-agent = { path = "../../crates/fulgurite-agent" }
serde_json = "1"

[features]
default = []
# So `just windows-drive` can run this window under both invalidation
# strategies (M89/T89.2's phase 1) -- a compile-time choice made in `main`
# (`Program::invalidation`, M55/T55.4), as examples/tasks-demo's is; not
# forwarded to fulgurite-winit.
everything = []
# The platform accessibility adapter — the window crate's (M54/T54.2).
a11y = ["fulgurite-winit/a11y"]
# Passed through so `just profile` can measure the rasteriser's SIMD
# path on a real frame (M17/T17.1, docs/results-simd.md).
simd = ["fulgurite-winit/simd"]
threads = ["fulgurite-winit/threads"]
