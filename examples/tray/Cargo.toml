[package]
name = "tray"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# M90/T90.7 (docs/plan-desktop-integration.md): a tray application -- a
# daemon (`daemon(boot)`, M89/T89.6) whose only surface is a Linux tray
# item (Open, Lock, Quit). `just tray-drive` drives it through the
# desktop's StatusNotifierWatcher and the item's dbusmenu, the OS path.
#
# **The binary requires `tray`**, which is default-off, because a
# workspace member's normal dependency features unify into every
# `--workspace` build: a `tray` named here unconditionally would link
# `ksni` into every test binary and every example that `cargo build
# --workspace` builds (examples/shader's manifest has the same reason).
# The library -- the program, its hooks and their headless tests -- builds
# without it.
[[bin]]
name = "tray"
path = "src/main.rs"
required-features = ["tray"]

[dependencies]
fulgurite = { path = "../../crates/fulgurite" }
fulgurite-widgets = { path = "../../crates/fulgurite-widgets", features = ["observe"] }
fulgurite-winit = { path = "../../crates/fulgurite-winit", features = ["agent"] }
fulgurite-shell = { path = "../../crates/fulgurite-shell", features = ["truetype"] }

[features]
default = []
# The Linux tray: fulgurite-winit's `tray` (`ksni` over D-Bus).
tray = ["fulgurite-winit/tray"]
# Both programs under `Everything`, so the drive runs both strategies -- a
# compile-time choice made in `main.rs`, as examples/daemon's is.
everything = []
