[package]
name = "tasks-demo"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# M28/T28.12 — "use the thing". An application that spawns, batches,
# chains, cancels and subscribes, driven through the agent endpoint
# against a live window. AGENT.md, after M24: defects hide in machinery
# tested pass by pass and never assembled.
[dependencies]
lumen-static = { path = "../../crates/lumen-static" }
lumen-static-widgets = { path = "../../crates/lumen-static-widgets", features = ["observe"] }
lumen-static-winit = { path = "../../crates/lumen-static-winit", features = ["agent"] }

# So the drive script can run the same application under both
# invalidation strategies. A compile-time choice, made in this crate's
# `main` (`Program::invalidation`) since M55/T55.4 -- not forwarded to
# lumen-static-winit, whose `everything` feature changed every window in
# the build graph.
[features]
default = []
everything = []
