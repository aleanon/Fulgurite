[package]
name = "form"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The M8/M9 widget set through the real rasteriser -- `just fixtures`
# runs it and it asserts. It was `counter-window --form` until M60/T60.4
# (`docs/plan-tally-slim.md`): a different application that shared four
# palette constants with the tally, and nothing else.
[dependencies]
fulgurite = { path = "../../crates/fulgurite" }
fulgurite-widgets = { path = "../../crates/fulgurite-widgets" }
# `agent` for `Host::sheet_findings`: the fixture asserts every rule in
# its sheet does something (M25/T25.2).
fulgurite-shell = { path = "../../crates/fulgurite-shell", features = ["truetype", "agent"] }
