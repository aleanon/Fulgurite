# lumen-static — static-tree GUI framework (spec: docs/00-handoff-static-tree.md).
# Virtual workspace manifest.
[workspace]
resolver = "2"
members = [
    "crates/lumen-static",
    "crates/lumen-static-agent",
    "crates/lumen-static-reload",
    "crates/lumen-static-macros",
    "crates/lumen-static-lss",
    "crates/lumen-static-shell",
    "crates/lumen-static-text",
    "crates/lumen-static-winit",
    "crates/lumen-static-wgpu",
    "crates/lumen-static-widgets",
    "benches",
    "examples/counter",
    "examples/minimal",
    "examples/wake-gate",
    "examples/tasks-demo",
    "examples/counter-window",
    "examples/form",
    "examples/glasswall",
    "examples/showcase",
    "examples/glass",
    "examples/shader",
    "examples/two-windows",
    "fixtures/hot-app",
    "fixtures/miri-smoke",
    "fixtures/miri-reload",
    "fixtures/panic-app",
    "fixtures/binsize",
    "fixtures/const-budget",
    "fixtures/hot-host",
    "fixtures/stamp-lib",
    "fixtures/stamp-host",
    "fixtures/reload-app",
    "fixtures/reload-host",
    "fixtures/chain-app",
    "fixtures/hot-window",
    "fixtures/embedded",
    "fixtures/observe-tests",
    "fixtures/bake-font",
]
# The Step 1 firewall experiment is its own generated workspace.
exclude = ["experiments"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[profile.bench-opt]
inherits = "release"
debug = true

# The software rasteriser and the glyph rasteriser run optimised even in
# dev builds. Unoptimised, a frame of the tally was 190 ms (clearing the
# canvas alone was 3.4 ms); at opt-level 3 it was still 2 ms, because
# debug-assertions also switch on std's `ub_checks` inside every slice
# operation the inner loops are made of; with both off it is 0.8 ms,
# the same as release. The core, the macros and the examples are still
# compiled for debugging. `docs/results-frame-cost.md`.
[profile.dev.package.lumen-static-shell]
opt-level = 3
debug-assertions = false
[profile.dev.package.fontdue]
opt-level = 3
