# lumen-static — static-tree GUI framework (spec: docs/00-handoff-static-tree.md).
# Virtual workspace manifest.
[workspace]
resolver = "2"
members = [
    "crates/lumen-static",
    "crates/lumen-static-agent",
    "crates/lumen-static-macros",
    "benches",
    "fixtures/hot-app",
    "fixtures/miri-smoke",
    "fixtures/binsize",
    "fixtures/hot-host",
]
# The Step 1 firewall experiment is its own generated workspace.
exclude = ["experiments"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[profile.bench-opt]
inherits = "release"
debug = true
