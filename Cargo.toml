# fulgurite — static-tree GUI framework (spec: docs/00-handoff-static-tree.md).
# Virtual workspace manifest.
[workspace]
resolver = "2"
members = [
    "crates/fulgurite",
    "crates/fulgurite-agent",
    "crates/fulgurite-reload",
    "crates/fulgurite-macros",
    "crates/fulgurite-lss",
    "crates/fulgurite-shell",
    "crates/fulgurite-text",
    "crates/fulgurite-winit",
    "crates/fulgurite-wgpu",
    "crates/fulgurite-widgets",
    "benches",
    "examples/counter",
    "examples/minimal",
    "examples/wake-gate",
    "examples/tasks-demo",
    "examples/counter-window",
    "examples/form",
    "examples/glasswall",
    "examples/showcase",
    "examples/glass",
    "examples/shader",
    "examples/two-windows",
    "examples/daemon",
    "examples/tray",
    "fixtures/hot-app",
    "fixtures/miri-smoke",
    "fixtures/miri-reload",
    "fixtures/panic-app",
    "fixtures/binsize",
    "fixtures/const-budget",
    "fixtures/hot-host",
    "fixtures/stamp-lib",
    "fixtures/stamp-host",
    "fixtures/reload-app",
    "fixtures/reload-host",
    "fixtures/chain-app",
    "fixtures/hot-window",
    "fixtures/embedded",
    "fixtures/observe-tests",
    "fixtures/bake-font",
]
# The Step 1 firewall experiment is its own generated workspace.
exclude = ["experiments"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[profile.bench-opt]
inherits = "release"
debug = true

# M90/T90.7: **a measuring profile, not a shipping one.** The tray's size
# recipe (`book/src/platform.md`, "The tray") is three per-package
# `opt-level = "s"` lines an application puts in ITS OWN top-level
# Cargo.toml -- Cargo reads profiles from the top-level workspace only, so
# a library cannot ship them. They are here under a custom profile so
# `scripts/check_tray_symbols.sh` can print what they save without moving
# `[profile.release]`, which every other recorded size (`a11y`'s
# included) was measured under. Nothing builds with it by default.
# Numbers: docs/results-desktop-integration.md T90.7.
[profile.release-small]
inherits = "release"
[profile.release-small.package.zbus]
opt-level = "s"
[profile.release-small.package.zvariant]
opt-level = "s"
[profile.release-small.package.ksni]
opt-level = "s"

# The software rasteriser and the glyph rasteriser run optimised even in
# dev builds. Unoptimised, a frame of the tally was 190 ms (clearing the
# canvas alone was 3.4 ms); at opt-level 3 it was still 2 ms, because
# debug-assertions also switch on std's `ub_checks` inside every slice
# operation the inner loops are made of; with both off it is 0.8 ms,
# the same as release. The core, the macros and the examples are still
# compiled for debugging. `docs/results-frame-cost.md`.
[profile.dev.package.fulgurite-shell]
opt-level = 3
debug-assertions = false
[profile.dev.package.fontdue]
opt-level = 3
