# Tier 1 of the gate, for a hosted runner (owner decision 2026-10-08;
# docs/results-ci-time.md, "Tier 1").
#
# **This workflow has not run on GitHub yet**: the repository has no git
# remote. Its recipes have: `just ci-fast` is this file's whole gate,
# timed on four CPUs of the reference machine with the dependencies cached
# and the workspace cold, as rust-cache leaves it (the results doc owns
# the figures). The full gate stays local -- `just ci` (scripts/ci.sh)
# against a commit in a clean worktree, checked by `just ci-verify` --
# because it needs the GPU, a desktop session and time a hosted runner
# does not have.
#
# Two rules shape everything here:
#
#   1. CI runs `just` recipes, never bare cargo lines. The justfile is the
#      gate; if CI reimplemented it the two would drift. One recipe per
#      step, so a red X names the stage that failed.
#
#   2. Nothing in the required path compares a number produced on this
#      runner to one measured elsewhere. GitHub runners are shared vCPUs;
#      the reference machine is an i9-13900KF.
#
# The gate's jobs run in parallel, so a push waits for the slowest of
# them, not their sum.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The non-gating jobs below (bench, coverage, miri, portability) run
  # nightly rather than on every push: each costs more than the gate.
  schedule:
    - cron: "17 3 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Line tables, not full debug info: test binaries link faster and the
  # cache is smaller. NOT `0`: the panic screen's test reads the
  # application's frame from a backtrace's file and line, and fails
  # without them (docs/results-ci-time.md, "Tier 1").
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  # ---------------------------------------------------------------------
  # The gate: lint, test and live, each on its own runner.
  # ---------------------------------------------------------------------
  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the toolchain, its components and the
      # thumb target; `rustup show` materialises exactly that. Declaring
      # one here would be a second source of truth.
      - run: rustup show
      # Pillow: `just static` runs scripts/ui_check.py's selftest.
      - run: sudo apt-get install -y --no-install-recommends python3-pil
      - uses: Swatinem/rust-cache@v2
        with:
          key: lint
      - uses: extractions/setup-just@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      # No compile; first, so a dead doc reference is not found after a build.
      - name: Static drift checks
        run: just static
      - name: Licences and advisories
        run: just deny
      - name: The core's release shape
        run: just release-shape
      - name: Clippy, default workspace
        run: just lint-fast

  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      # A system face for the text tests that look for one.
      - run: sudo apt-get install -y --no-install-recommends fonts-dejavu-core
      - uses: Swatinem/rust-cache@v2
        with:
          key: test
      - uses: extractions/setup-just@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Tests (nextest) and doctests, default workspace
        run: just test-fast

  live:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      # Xvfb is the display. winit opens libxkbcommon-x11 and the X
      # extensions at run time; xclip is owner decision D7's prerequisite;
      # Pillow is what the drive saves a failing frame pair with.
      - run: >
          sudo apt-get install -y --no-install-recommends
          xvfb xauth libxkbcommon-x11-0 libxcursor1 libxi6 libxrandr2
          fonts-dejavu-core xclip python3-pil
      - uses: Swatinem/rust-cache@v2
        with:
          key: live
      - uses: extractions/setup-just@v2
      - name: Live smoke (the counter window, the widget drive's Boundaries leg)
        run: xvfb-run -a -s "-screen 0 1920x1200x24" just live-fast
      - name: Live logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-${{ github.sha }}
          path: target/live/
          retention-days: 14

  # ---------------------------------------------------------------------
  # Nightly, non-gating. Each reports; none blocks a merge.
  # ---------------------------------------------------------------------

  # Benchmarks run for their exit code only: a shared vCPU's timings are
  # not comparable to the reference machine's.
  bench:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: bench
      - uses: extractions/setup-just@v2
      - name: Run benchmarks (exit code only)
        run: just bench 2>&1 | tee bench-output.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-output-${{ github.sha }}
          path: bench-output.txt
          retention-days: 90

  # Coverage: a number to read, not a threshold.
  coverage:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show && rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          key: coverage
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Measure
        run: |
          cargo llvm-cov --workspace --exclude lumen-static-wgpu --lcov --output-path lcov.info
          {
            echo '### Coverage'
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: lcov-${{ github.sha }}
          path: lcov.info
          retention-days: 90

  # The hot-reload FFI's UB check (fixtures/miri-reload, M49/T49.3); also
  # a `just ci` step locally.
  miri:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly --component miri --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          key: miri
      - run: cargo +nightly miri run -p miri-reload

  # aarch64 macOS: an f32 check rather than a portability one -- the
  # layout engine is float arithmetic and the tests assert positions.
  # Make it blocking the day the project claims cross-platform support.
  portability:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: portability
      - run: cargo test --workspace --exclude lumen-static-wgpu
