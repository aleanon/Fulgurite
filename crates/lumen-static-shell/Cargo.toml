[package]
name = "lumen-static-shell"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Real glyph rasterization for the software renderer. Optional: the
# headless oracle and every test work without it, on the block-metrics
# stand-in. See src/text.rs.
fontdue = { version = "0.9", optional = true }
lumen-static = { path = "../lumen-static" }
# Safe SIMD types for the shadow SDF (T17.1). Optional; see the feature.
wide = { version = "0.7", optional = true, default-features = false }
# M37/T37.1: the agent's bridge to a session lives with the tree, so it
# moved here from the window crate (`session::Live`). Behind `live-agent`.
lumen-static-agent = { path = "../lumen-static-agent", optional = true }
serde_json = { version = "1", optional = true }

[features]
default = []
# `Host::reload` — the host-side half of a hot swap (M31/T31.0). Optional
# for the same reason `lumen-static`'s own `reload` is: an application
# that never swaps a dylib should not link serde_json to be told so.
reload = ["lumen-static/reload"]
# The stylesheet lint, and the findings the agent reports as `W1010`
# (M25/T25.2, gated by M26/T26.18).
#
# **Default-OFF because it is a development diagnostic, and it is not
# free.** `lint_sheet_deep` is O(rules × nodes) and re-walks every arena
# once per rule: **183 µs** on a 27-rule sheet over 901 nodes, against
# the 66 µs the cascade costs over the same sheet
# (`docs/results-frame-and-types.md` T26.0). `Host::set_stylesheet` ran
# it unconditionally, in every build, so an application that never
# attaches an agent paid it on every sheet swap for findings nothing
# could read.
#
# Nothing else is gated: `style::lint_sheet_deep` is generic, so a build
# that never calls it never instantiates it, and the `Seed::reads` masks
# it compares against are two bytes of rodata per kind.
agent = []
# M37/T37.1: a session answers the agent's requests itself, because the
# tree it inspects lives wherever the session does -- in a hot library,
# on the far side of the loader. Separate from `agent`, which is only the
# lint: a test that wants the lint should not get `observe` with it.
live-agent = ["agent", "dep:lumen-static-agent", "dep:serde_json"]
# The whole-tree invalidation walk instead of `Boundaries` -- a
# diagnostic (M34/T34.2); `session::Inval` reads it.
everything = []
truetype = ["dep:fontdue"]
# M34/T34.1: after every bounded frame, lay out again under an all-dirty
# view into scratch state and compare — a live invalidation oracle. It
# re-runs layout (measure memos, repeater binds) every frame, so it is a
# diagnostic, compiled in only on request; `Host::shadow_report` and the
# agent's `app.shadow` read it.
shadow-oracle = []
# Explicit SIMD in the rasteriser's hot loop (M17/T17.1).
#
# Default-OFF, and gated as a feature rather than a crate because it is
# one dependency and one code path inside an existing file, not a new
# capability -- the M15 policy's third mechanism, used where the first
# two do not fit. `docs/results-simd.md` states its cost.
#
# `wide` and not `core::arch`: intrinsics are all `unsafe`, and
# scripts/check_no_unsafe.sh has held zero `unsafe` across every
# crates/*/src since M0. `wide` is a safe wrapper, `no_std`-clean, and
# keeps that gate absolute rather than growing an exception.
simd = ["dep:wide"]
# Band-parallel rasterisation (M17/T17.4). Default-OFF and **desktop
# only** -- `no_std` has no threads, which is why this is a feature and
# not the default. No dependency: `std::thread::scope` is enough, and
# disjoint row bands are a safe split of the pixel buffer, so the gate
# in scripts/check_no_unsafe.sh stays absolute.
#
# Byte-identical by construction: bands own disjoint pixels and each
# draws every command that reaches its rows, in order. `just threads`
# asserts it against the single-band build.
threads = []

[dev-dependencies]
# `observe` since M48/T48.9: the tests built with `live-agent` turn the
# core's `observe` on through the agent, and the widgets crate now refuses
# to compile with the core's on and its own off -- which is what these
# tests had been doing, reading every widget as `GenericContainer`.
lumen-static-widgets = { path = "../lumen-static-widgets", features = ["reload", "observe"] }
# `reload` for `tests/reload_sheet.rs`, which drives the swap sequence
# (`save` / `fresh` / `restore`) against a live `Host` -- the one place
# the stylesheet's behaviour across a reload can be observed, because
# `fixtures/hot-host` never constructs a `Host` at all. Dev-only: the
# shell itself does not depend on the reload surface.
lumen-static = { path = "../lumen-static", features = ["reload"] }
# M49/T49.0: `tests/reload_schema.rs` keeps serde structs whose shape
# changes between two builds.
serde = { version = "1", features = ["derive"] }

# M34/T34.1: needs the oracle compiled in; `just test` runs it with the
# feature (`dev-shape`).
[[test]]
name = "shadow"
required-features = ["shadow-oracle"]

# M39/T39.0: drives `Session::agent`, which exists with the agent built in
# and a session at all (`truetype`).
[[test]]
name = "agent_panic"
required-features = ["live-agent", "truetype"]

# M42/T42.1: drives `Session::agent`'s `app.diagnostics`, which needs the
# agent built in and a session at all (`truetype`).
[[test]]
name = "process_info"
required-features = ["live-agent", "truetype"]

# M45/T45.7: drives `Session::agent`'s `input.paste`.
[[test]]
name = "agent_paste"
required-features = ["live-agent", "truetype"]

# M45/T45.6: drives `input.key`'s `mods` and `input.click`'s `clicks`.
[[test]]
name = "agent_motion"
required-features = ["live-agent", "truetype"]

# M48/T48.0: drive `Session::agent` as the window does (the RPC, the
# redraw, `agent_frame_done`), which needs the agent built in.
[[test]]
name = "agent_frames"
required-features = ["live-agent", "truetype"]

[[test]]
name = "agent_settled"
required-features = ["live-agent", "truetype"]

[[test]]
name = "agent_compose"
required-features = ["live-agent", "truetype"]
