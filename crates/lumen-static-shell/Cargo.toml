[package]
name = "lumen-static-shell"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Real glyph rasterization for the software renderer. Optional: the
# headless oracle and every test work without it, on the block-metrics
# stand-in. See src/text.rs.
fontdue = { version = "0.9", optional = true }
lumen-static = { path = "../lumen-static" }
# M61/T61.5: `lss::load`, the run-time reading of a `.lss` sheet. Not
# optional -- a std crate with no dependencies -- and reached only through
# `Program::live_lss`, which the window calls in debug and `reload` builds,
# so a release build without `reload` links none of it (kill rule K3,
# docs/plan-lss.md §5; scripts/check_lss_release.sh counts the symbols).
lumen-static-lss = { path = "../lumen-static-lss" }
# Safe SIMD types for the shadow SDF (T17.1). Optional; see the feature.
wide = { version = "0.7", optional = true, default-features = false }
# M37/T37.1: the agent's bridge to a session lives with the tree, so it
# moved here from the window crate (`session::Live`). Behind `live-agent`.
lumen-static-agent = { path = "../lumen-static-agent", optional = true }
serde_json = { version = "1", optional = true }
# M81/T81.1 (D1 a, docs/plan-shaped-paint.md): the shaper, behind
# `shaping` below. The text crate names only `lumen-static` in its own
# dependencies, so this edge forms no cycle.
lumen-static-text = { path = "../lumen-static-text", optional = true }
# M82/T82.7: glyph outlines for `TextMeasure::outline`, behind `vector-text`
# below. The version and the two features fontdue 0.9 already builds it
# with (`no-std-float`, `opentype-layout`, default features off), so the
# graph gains no package and no feature: 0 new crates (C32).
ttf-parser = { version = "0.25", optional = true, default-features = false, features = ["no-std-float", "opentype-layout"] }
# M83/T83.1 (D1 b, docs/plan-gpu-extension.md): `backend::BackendTarget`
# carries the window as raw handles, so the shell can hold the `Backend`
# trait without naming winit. Optional, enabled by `truetype` (where the
# `backend` module lives): the default build gains no crate. `std` (hence
# `alloc`) because the `Arc<H: ?Sized>` impls the target relies on are
# behind `alloc`. 0.6.2, already in the lock through winit, softbuffer
# and wgpu, so the window's graph gains none (K83d,
# docs/results-shader.md T83.1).
raw-window-handle = { version = "0.6", features = ["std"], optional = true }

[features]
default = []
# `Host::reload` — the host-side half of a hot swap (M31/T31.0). Optional
# for the same reason `lumen-static`'s own `reload` is: an application
# that never swaps a dylib should not link serde_json to be told so.
reload = ["lumen-static/reload"]
# The stylesheet lint, and the findings the agent reports as `W1010`
# (M25/T25.2, gated by M26/T26.18).
#
# **Default-OFF because it is a development diagnostic, and it is not
# free.** `lint_sheet_deep` is O(rules × nodes) and re-walks every arena
# once per rule: **183 µs** on a 27-rule sheet over 901 nodes, against
# the 66 µs the cascade costs over the same sheet
# (`docs/results-frame-and-types.md` T26.0). `Host::set_stylesheet` ran
# it unconditionally, in every build, so an application that never
# attaches an agent paid it on every sheet swap for findings nothing
# could read.
#
# Nothing else is gated: `style::lint_sheet_deep` is generic, so a build
# that never calls it never instantiates it, and the `Seed::reads` masks
# it compares against are two bytes of rodata per kind.
agent = []
# M37/T37.1: a session answers the agent's requests itself, because the
# tree it inspects lives wherever the session does -- in a hot library,
# on the far side of the loader. Separate from `agent`, which is only the
# lint: a test that wants the lint should not get `observe` with it.
live-agent = ["agent", "dep:lumen-static-agent", "dep:serde_json"]
# (No `everything` feature since M55/T55.4, R12-F5: a feature that changed
# the type of `Local::host` for every crate in the graph. The diagnostic
# is `Program::invalidation::<Everything>()`, in the application's code.)
# The screen-reader tree a window hands its platform adapter (M54/T54.2):
# `Host::accessibility_tree` and `Session::a11y_tree`. Forwards the core's
# `a11y` (docs/plan-a11y-platform.md §2.1), which pulls accesskit and
# nothing of the agent.
a11y = ["lumen-static/a11y"]
# M83/T83.1: `truetype` also holds the `backend` module, whose target
# carries raw window handles: +1 crate (`raw-window-handle`) over 16.
truetype = ["dep:fontdue", "dep:raw-window-handle"]
# Shaped paint (M81, docs/plan-shaped-paint.md D1 a): the shell reaches
# `lumen-static-text`'s shaper (rustybuzz, unicode-bidi) through this
# feature. **Default-OFF.** Since M81/T81.3 it holds the `Complex` mode of
# `text::FontStack` (`text::Shaping`): measure, clusters and paint through
# the shaper for a run that needs shaping. It joins the ABI stamp's feature
# list (`session::abi_fields`) and `process_features`, so the stamp
# refuses a library built with it under a loader built without. A default
# release window links 0 shaper symbols, one with it 310
# (`just release-window-shape`); the stripped showcase grows +748,960 B
# with it, against K81e's 3 MB (docs/results-text.md M81/T81.3). Its cost
# by K2's method (`cargo tree -p
# lumen-static-shell -e normal --prefix none`, `(*)` stripped,
# deduplicated): **8 -> 27** packages over the default, 16 -> 27 over
# `truetype` (2026-10-04, T81.1); **28** since T81.2 added
# `unicode-linebreak` to the text crate (16 -> 28 over `truetype`);
# T81.3 adds none (28).
shaping = ["truetype", "dep:lumen-static-text"]
# Vector text (M82/T82.7, docs/plan-paint-vocabulary.md "Vector text is
# outlines from the measurer"): `FontStack::outline` and
# `FontMetrics`'s `TextMeasure::outline`, from ttf-parser's glyph outlines,
# which is what `VectorText` paints under a rotation. **Default-OFF**:
# under it a stack keeps each face's bytes after parsing them (fontdue
# keeps none), which the default should not pay. Its price, measured
# 2026-10-06 (docs/results-paint-vocabulary.md T82.7): **0** new packages
# by K2's method (16 -> 16 over `truetype`; ttf-parser was already fontdue's),
# the stripped showcase +10,240 B against K2's 3 MB, and a default
# release window links 0 outline symbols, one with it 10
# (`just release-window-shape`). Not in the ABI stamp's feature list, by
# a recorded exception (`session::abi_fields`; docs/plan-iced-roadmap.md
# §2.3): no `FontStack` crosses the seam.
vector-text = ["truetype", "dep:ttf-parser"]
# M34/T34.1: after every bounded frame, lay out again under an all-dirty
# view into scratch state and compare — a live invalidation oracle. It
# re-runs layout (measure memos, repeater binds) every frame, so it is a
# diagnostic, compiled in only on request; `Host::shadow_report` and the
# agent's `app.shadow` read it.
shadow-oracle = []
# Explicit SIMD in the rasteriser's hot loop (M17/T17.1).
#
# Default-OFF, and gated as a feature rather than a crate because it is
# one dependency and one code path inside an existing file, not a new
# capability -- the M15 policy's third mechanism, used where the first
# two do not fit. `docs/results-simd.md` states its cost.
#
# `wide` and not `core::arch`: intrinsics are all `unsafe`, and
# scripts/check_no_unsafe.sh has held zero `unsafe` across every
# crates/*/src since M0. `wide` is a safe wrapper, `no_std`-clean, and
# keeps that gate absolute rather than growing an exception.
simd = ["dep:wide"]
# Band-parallel rasterisation (M17/T17.4). Default-OFF and **desktop
# only** -- `no_std` has no threads, which is why this is a feature and
# not the default. No dependency: `std::thread::scope` is enough, and
# disjoint row bands are a safe split of the pixel buffer, so the gate
# in scripts/check_no_unsafe.sh stays absolute.
#
# Byte-identical by construction: bands own disjoint pixels and each
# draws every command that reaches its rows, in order. `just threads`
# asserts it against the single-band build.
threads = []
# **Test-only: counters, never a path** (M50/T50.4, T50.5;
# `docs/plan-raster-allocation.md` §2.4). Marks a band worker's own code
# for `tests/alloc_gate_threads.rs`, so the allocations `std` makes
# starting a thread are told apart from the worker's; and counts each
# `simd` vector branch as it runs. `just threads` and `just simd` turn it
# on; a shipped build never does.
raster-counters = []

[dev-dependencies]
# `observe` since M48/T48.9: the tests built with `live-agent` turn the
# core's `observe` on through the agent, and the widgets crate now refuses
# to compile with the core's on and its own off -- which is what these
# tests had been doing, reading every widget as `GenericContainer`.
lumen-static-widgets = { path = "../lumen-static-widgets", features = ["reload", "observe"] }
# `reload` for `tests/reload_sheet.rs`, which drives the swap sequence
# (`save` / `fresh` / `restore`) against a live `Host` -- the one place
# the stylesheet's behaviour across a reload can be observed, because
# `fixtures/hot-host` never constructs a `Host` at all. Dev-only: the
# shell itself does not depend on the reload surface.
lumen-static = { path = "../lumen-static", features = ["reload"] }
# M49/T49.0: `tests/reload_schema.rs` keeps serde structs whose shape
# changes between two builds.
serde = { version = "1", features = ["derive"] }
# M81/T81.3: `tests/alloc_gate.rs` `mod complex` counts what one
# `BidiInfo` costs, so a changing right-to-left label is held to exactly
# that. The version the text crate's shaper uses, so it is one crate.
unicode-bidi = "0.3"

# M34/T34.1: needs the oracle compiled in; `just test` runs it with the
# feature (`dev-shape`).
[[test]]
name = "shadow"
required-features = ["shadow-oracle"]

# M39/T39.0: drives `Session::agent`, which exists with the agent built in
# and a session at all (`truetype`).
[[test]]
name = "agent_panic"
required-features = ["live-agent", "truetype"]

# M42/T42.1: drives `Session::agent`'s `app.diagnostics`, which needs the
# agent built in and a session at all (`truetype`).
[[test]]
name = "process_info"
required-features = ["live-agent", "truetype"]

# M45/T45.7: drives `Session::agent`'s `input.paste`.
[[test]]
name = "agent_paste"
required-features = ["live-agent", "truetype"]

# M45/T45.6: drives `input.key`'s `mods` and `input.click`'s `clicks`.
[[test]]
name = "agent_motion"
required-features = ["live-agent", "truetype"]

# M48/T48.0: drive `Session::agent` as the window does (the RPC, the
# redraw, `agent_frame_done`), which needs the agent built in.
[[test]]
name = "agent_frames"
required-features = ["live-agent", "truetype"]

[[test]]
name = "agent_settled"
required-features = ["live-agent", "truetype"]

[[test]]
name = "agent_compose"
required-features = ["live-agent", "truetype"]

# M50/T50.0: a banded frame's allocations on every thread, counted
# process-wide in a binary of its own; `just threads` runs it.
[[test]]
name = "alloc_gate_threads"
required-features = ["threads", "raster-counters"]

# M60/T60.1-T60.2: the program hooks through `Session::agent`.
[[test]]
name = "agent_hooks"
required-features = ["live-agent", "truetype"]

# M60/T60.3: the session's audit measures with the session's face.
[[test]]
name = "agent_audit_face"
required-features = ["live-agent", "truetype"]

# M81/T81.3: the shaped-paint pins, moved here from lumen-static-text
# (whose dev edge to this crate is dropped), on a stack in Complex mode.
[[test]]
name = "paint_shaped"
required-features = ["shaping", "truetype"]

# M81/T81.5: caret, selection and hit test over bidi runs, on a stack in
# Complex mode.
[[test]]
name = "bidi_caret"
required-features = ["shaping", "truetype"]

# M82/T82.7: outlines from the measurer, which exist only under
# `vector-text`; `just test` runs it with the feature named, so the default
# selection never builds an empty binary.
[[test]]
name = "vector_text"
required-features = ["vector-text"]
