[package]
name = "lumen-static-widgets"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
lumen-static = { path = "../lumen-static", default-features = false }
# Only under `observe`; `lumen-static` gates its own the same way.
accesskit = { version = "0.25", optional = true }
# M45/T45.5: editing steps by extended grapheme cluster. `no_std` and
# allocation-free, and behind `alloc` anyway, so the leaf profile — which
# takes neither — links none of its tables (docs/results-embedded.md).
unicode-segmentation = { version = "1", optional = true, default-features = false }
# Only under `reload`, exactly as `lumen-static` gates its own.
serde_json = { version = "1", optional = true }

[features]
default = ["std"]
# **The crate is the gate for the optional tier** — but M30 measured
# what that was worth for the essential one and moved it in. The leaf
# `no_std` profile links `.text` 27,024 B with every widget here against
# 27,036 B with the first tier in core (`docs/results-widget-crate.md`):
# twelve bytes SMALLER, because the gate was never the crate. It is
# `#[cfg(feature)]` and the linker, and both drop what a tree does not
# name whichever crate it lives in.
#
# So: one crate owns widgets, an application names it once, and a widget
# set that grows without limit still cannot cost an embedded profile
# anything it did not ask for — `alloc`-needing widgets stay behind
# `alloc`, and a leaf profile takes neither feature.
# `std` implies `alloc`, the tiering `lumen-static` uses: the two are
# nested, not alternatives, and a crate that took `std` without `alloc`
# would lose `Vec` for no reason anyone asked for.
std = ["alloc", "lumen-static/std"]
alloc = ["lumen-static/alloc", "dep:unicode-segmentation"]
# **The agent-facing half — M27/T27.5.** Without this no widget in this
# crate publishes a role or a value, so `ui.getTree` sees geometry and
# nothing else and a drive script cannot read a number field's number.
# Every widget here shipped without it and nothing noticed, because
# nothing had ever asked one of them a question. Default-off and additive
# for the same reason `lumen-static`'s is: it takes `NodeDesc` from 48 B
# to 72 B in every binary that links it.
observe = ["std", "dep:accesskit", "lumen-static/observe"]
# **M30.** `Reloadable` for the widgets this crate owns — the impls that
# moved with `Label`, `Button`, `Toggle`, `Fixed` and `Spacer`. Gated
# exactly as `lumen-static`'s is, and for the same reason: the dev
# surface must compile to nothing in a release build.
reload = ["std", "dep:serde_json", "lumen-static/reload"]
