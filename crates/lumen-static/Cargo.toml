[package]
name = "lumen-static"
version.workspace = true
edition.workspace = true
license.workspace = true
# M83/T83.3 (docs/plan-gpu-extension.md, "Feature placement"): `links`
# exists so `build.rs` can hand its dependents `DEP_LUMEN_STATIC_SHADER`,
# which is how a crate outside the core learns whether `Cmd::Shader`
# exists in this graph (its own `cfg(feature)` tests its own feature, not
# this one). Cargo then also refuses two copies of this package in one
# graph.
links = "lumen_static"
build = "build.rs"

[lib]
name = "lumen_static"

[dependencies]
lumen-static-macros = { path = "../lumen-static-macros" }
# Dev-surface deps (S9: one gate, zero release cost). Hot reload (S7)
# serializes keep-fields as JSON — debuggability and per-field fallback
# beat compactness on a dev-only path.
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
accesskit = { version = "0.25", optional = true }

[features]
# Three tiers, all default-on, in the shape serde and hashbrown use
# (M13/T13.1). There is deliberately NO `no_std` feature: cargo features
# are additive and unified across a build, so a subtractive one would let
# a single dependent strip `std` from every other crate in the graph that
# never asked for it -- in a build that still compiles. An embedded
# consumer writes `default-features = false`, or `features = ["alloc"]`
# for the middle tier. See docs/plan-embedded.md T13.1.
default = ["std"]
std = ["alloc"]
alloc = []
# The accessibility tree (M54/T54.1, docs/plan-a11y-platform.md §2.1):
# every widget's `Node::observe`, the static walk and
# `observe::snapshot`, which a screen-reader adapter sends. Split out of
# `observe` so a release application can carry the tree without the
# agent's dev surface: it leaves `NodeDesc` at 48 B (tests/desc_size.rs)
# and links no serde. Requires `std` for the reason below.
a11y = ["std", "dep:accesskit"]
# The S9 dev surface: additive, off in release builds. Implies `a11y`, and
# adds the JSON dump, `probe`, `stats` and the `NodeDesc.src` stamp (48 ->
# 72 B). Both require `std`: they pull accesskit and serde_json, which are
# not no_std, so without the requirement `--no-default-features --features
# alloc,observe` would resolve cleanly and then fail deep inside a
# dependency instead of at the point of the mistake.
observe = ["a11y", "dep:serde", "dep:serde_json"]
reload = ["std", "dep:serde", "dep:serde_json"]
# Forwarded to the derive: see docs/results-safe-prototype.md.
# Measurement only: makes the recursive arm's dispatch opaque to the
# optimizer, to prove it is real. See docs/results-traversal.md.
rdyn_opaque = ["lumen-static-macros/rdyn_opaque"]
# M83/T83.3 (owner decision D3, 2026-09-30; docs/plan-gpu-extension.md):
# custom shaders -- `Cmd::Shader`/`Cmd::ShaderEnd`, `ShaderId`,
# `Painter::shader`/`shader_end` and the list's uniform buffer. Default
# off; with it off none of them exists, so the firmware links nothing of
# it (K83b, Δ 0 B). `build.rs` tells direct dependents through
# `DEP_LUMEN_STATIC_SHADER`, and they match the variants under
# `cfg(lumen_shader)`.
shader = ["alloc"]

[dev-dependencies]
# **M30.** The widgets moved out; core's own tests and doctests still
# exercise them, so this is a dev-cycle — which Cargo permits and which
# is the honest shape: the dependency is real, and it is only a
# dependency of the tests.
#
# **No features, and that is load-bearing** (M43/T43.7, R12-F1). A
# dev-dependency's features unify into the crate under test: when this
# line asked for the widgets' `observe`, `cargo test -p lumen-static` --
# the release-shape gate -- built core WITH `observe`. The tests that
# need it live in `fixtures/observe-tests`, whose manifest states the
# features itself; `just release-shape` builds with a cfg under which
# core refuses to compile with `observe` or `reload` on.
lumen-static-widgets = { path = "../lumen-static-widgets" }
serde = { version = "1", features = ["derive"] }

[[test]]
name = "reload"
required-features = ["reload"]

[[test]]
name = "text"
required-features = ["reload"]

[[test]]
name = "display"
required-features = []

# M83/T83.3: the shader bracket exists only under `shader`; without it the
# binary would build empty (`scripts/check_test_counts.sh`). `dev-shape`
# runs it with the feature named, so workspace unification does not decide.
[[test]]
name = "shader_cmd"
required-features = ["shader"]


# `just release-shape` sets `--cfg lumen_release_shape`, under which
# lib.rs refuses `observe`/`reload` (M43/T43.7). Declared so rustc's
# `unexpected_cfgs` lint knows it.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(lumen_release_shape)"] }
