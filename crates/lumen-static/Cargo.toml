[package]
name = "lumen-static"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "lumen_static"

[dependencies]
lumen-static-macros = { path = "../lumen-static-macros" }
# Hot reload (S7) serializes keep-fields as JSON: dev-mode only, chosen for
# debuggability and per-field fallback; release gating is future work.
serde = "1"
serde_json = "1"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
