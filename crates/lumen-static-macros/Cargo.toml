[package]
name = "lumen-static-macros"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }

# A dev-dependency cycle is legal (dev-deps are not in the normal build
# graph) and is what lets this crate's doctests and, later, its trybuild
# suite compile against the real derives instead of being ```ignore``d.
[dev-dependencies]
lumen-static-widgets = { path = "../lumen-static-widgets", features = ["reload"] }
# `reload` for the UI cases that exercise the `Reloadable` derive's
# application routing (M31/T31.2). The derive emits paths into
# `lumen_static::reload`, so a case that expands it needs the module to
# exist — without this the case fails on a missing module instead of on
# the diagnostic it is locking in place.
lumen-static = { path = "../lumen-static", features = ["reload"] }
trybuild = "1"

[features]
# Keep the generated accessor out of line: code size O(fields per
# type) instead of O(NODE_COUNT per root). See docs/results-safe-prototype.md.
# Measurement only: see docs/results-traversal.md.
rdyn_opaque = []
