[package]
name = "lumen-static-macros"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }

[features]
# Keep the generated accessor out of line: code size O(fields per
# type) instead of O(NODE_COUNT per root). See docs/results-safe-prototype.md.
safe_no_inline = []
