[package]
name = "lumen-static-reload"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "lumen_static_reload"

# The `unsafe` FFI shims live here rather than in the core, whose
# no-unsafe invariant is a gate rather than a preference.
[dependencies]
lumen-static = { path = "../lumen-static", features = ["reload"] }
# M37/T37.1: the window half -- `hot` (a library's session, and the loader
# that opens one behind the ABI stamp) and `export_program!`. It knows the
# shell's `Session`, which the shell cannot know about this crate without
# a cycle; and the loader's `unsafe` lives here because nothing else in
# `crates/` may hold any.
lumen-static-shell = { path = "../lumen-static-shell", features = ["truetype", "reload"], optional = true }
libloading = { version = "0.8", optional = true }

[features]
window = ["dep:lumen-static-shell", "dep:libloading"]

[dev-dependencies]
# M49/T49.4: `tests/one_path.rs` builds a real application.
lumen-static-widgets = { path = "../lumen-static-widgets", features = ["reload"] }
serde = { version = "1", features = ["derive"] }

[[test]]
name = "one_path"
required-features = ["window"]
