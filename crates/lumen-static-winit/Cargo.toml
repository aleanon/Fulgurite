[package]
name = "lumen-static-winit"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "lumen_static_winit"

# The only crate in the workspace with an OS dependency. Deliberately
# *not* a feature on lumen-static-shell: the shell is the headless half
# and every test in the workspace depends on it staying that way, so
# adding winit there would put a windowing system behind `cargo test`
# (docs/plan-desktop.md T14.0).
[features]
# No `everything` feature since M55/T55.4 (R12-F5). It selected
# `Everything` for every window in the build graph -- cargo unifies
# features, so one crate turning it on changed `Pane::host`'s type for
# all the others. The strategy is a type the application picks:
# `Program::invalidation::<Everything>()`, or `Pane<A, Everything>`.
# M36: a release window that shows a panic screen instead of crashing.
# A debug window always does; a shipped release build does not, unless it
# asks, so a crash reaches whatever would have reported it
# (docs/plan-panic-recovery.md rule 3). Without it a release window links
# no recovery code at all -- the policy is a type since M52/T52.7, and
# `just release-window-shape` counts 0 recover:: symbols.
reload = ["lumen-static-shell/reload"]
# M37: hot reload inside the window (`docs/plan-window-reload.md`). The
# window builds the application crate as a library on every save and
# swaps to it between frames, keeping `#[reload(keep)]` state. Implies
# `reload`, so a panic in the new code shows M36's screen, and requires
# the program's application to be `Reloadable`.
hot = ["reload", "dep:lumen-static-reload", "dep:notify"]
# The software rasteriser's two fast paths, forwarded so an application
# that depends only on this crate can reach them (M50/T50.5, R6-F5):
# `simd` vectorises the shadow and the blits (`docs/results-simd.md`),
# `threads` bands a large repaint across cores (`docs/results-threading.md`).
# **Both default-OFF, by decision** (`docs/plan-raster-allocation.md`
# §2.3): the recorded answer for full redraws on desktop is the GPU
# (`docs/results-gpu.md`), and `threads` spends a stated allocation budget
# per banded frame (`docs/results-allocation.md`, "The threaded
# rasteriser's budget"). `tests/raster_features.rs` checks both arms.
simd = ["lumen-static-shell/simd"]
threads = ["lumen-static-shell/threads"]
# M34/T34.1: the shadow oracle, reported by the agent's `app.shadow`.
shadow-oracle = ["lumen-static-shell/shadow-oracle"]
# Shaped paint (M81, docs/plan-shaped-paint.md D1 a): forwards the
# shell's default-off `shaping`, which pulls `lumen-static-text`'s shaper.
# It carries code since M81/T81.3 (a stack's `Complex` mode); since T81.4
# the window builds its stack in `Session::shaping`'s mode, which is the
# program's `Program::shaping`. Default-OFF: by K2's method (above, at
# `clipboard`) it costs **+7 crates** (96 -> 103, 2026-10-04): the text crate,
# rustybuzz and five unicode tables; ttf-parser is already in the graph.
# **+8** (96 -> 104) since M81/T81.2 added `unicode-linebreak`; unchanged
# by T81.3. A release window links 310 shaper symbols with it, 0 without.
shaping = ["lumen-static-shell/shaping"]
# Vector text (M82/T82.7, docs/plan-paint-vocabulary.md): forwards the
# shell's default-off `vector-text` -- `FontMetrics` answers
# `TextMeasure::outline` from ttf-parser, so `VectorText` draws a rotated
# run as a path instead of its axis-aligned fallback. Default-OFF: a stack
# keeps its faces' bytes under it. By K2's method (above, at `clipboard`)
# it costs **0 crates** (96 -> 96, 2026-10-06: ttf-parser is already
# fontdue's, with the same features); a release window links 0 outline
# symbols without it and 10 with it (`just release-window-shape`);
# the stripped showcase's delta is in docs/results-paint-vocabulary.md
# T82.7.
vector-text = ["lumen-static-shell/vector-text"]
# Custom shaders (M83, docs/plan-gpu-extension.md, owner decision D3):
# forwards the shell's default-off `shader` -- `ShaderDesc`, the contents of
# the `ShaderTable` the window hands each backend (`Backend::set_shaders`)
# -- and, in a `gpu` build, `lumen-static-wgpu`'s, so `GpuBackend` compiles
# the table and runs each bracket's pass (M83/T83.5). Added by M83/T83.4
# with the shell half only; T83.5 appended the wgpu half. Adds no crate.
shader = ["lumen-static-shell/shader", "lumen-static-wgpu?/shader"]
# Clipboard is default-ON: arboard costs **5 crates** (91 -> 96 for this
# crate, 2026-10-04, K2's method: `cargo tree -p lumen-static-winit -e
# normal --prefix none`, `(*)` markers stripped, deduplicated --
# docs/plan-iced-roadmap.md K2; the 2026-09-05 "11" counted the whole
# workspace graph, 207 -> 218). A text field without copy and paste is not a working text
# field. An application that wants neither this nor `a11y` writes
# `default-features = false`.
#
# Since M88/T88.4 it is also what an application's clipboard REQUESTS
# reach (`Win::serve_requests`): text and HTML on the clipboard, text on
# the primary selection (arboard's ungated `set_html`/`get().html()` and
# its Linux extension traits), at **0 new crates** (96 -> 96,
# docs/results-tasks.md T88.4). Images are not in it: they need arboard's
# `image-data`, which pulls an image-decoding stack.
#
# **Native Wayland has no clipboard in this build** (M88/T88.4): arboard
# is built with `default-features = false` and without
# `wayland-data-control`, so it speaks X11 only. Under XWayland the
# clipboard works; on a Wayland-only session `Clipboard::new` finds none
# and every clipboard request answers `Refused(Failed)`. Reopen when a
# Wayland-only session is a target, with that feature's crate count
# measured first (it pulls `wl-clipboard-rs`).
#
# **`a11y`: a screen reader can see the window** (M54/T54.2,
# docs/plan-a11y-platform.md §2.2-2.3). The platform adapter
# (`accesskit_winit`: AT-SPI, UI Automation, NSAccessibility) built before
# the window is shown, the whole tree sent when an assistive technology
# asks and after each frame while one is attached. Turns on the widgets'
# `a11y` too, so an application names one feature.
#
# **Default-OFF, by the kill rule written before it was built** (§2.3):
# the stripped release showcase grew by more than the 3 MB bound, and its
# idle redraw left the no-a11y build's eight-run spread with an assistive
# technology attached (docs/results-a11y-platform.md has both numbers). So
# a turnkey application is accessible **when it asks** --
# `features = ["a11y"]` here, which `examples/showcase` does -- and
# `Program::accessible(false)` turns the adapter off at run time.
a11y = ["dep:accesskit_winit", "lumen-static-shell/a11y", "dep:lumen-static-widgets", "lumen-static-widgets/a11y"]
default = ["clipboard"]
# The agent endpoint: a JSON-RPC socket that drives the *running* window
# (M23/T23.1c). Default-OFF and a feature rather than always-on, because
# `lumen-static-agent` builds `lumen-static` with `observe`, which takes
# `NodeDesc` from 48 B to 72 B in every binary that links it — the
# condition `docs/step5-observability.md`'s zero-release-cost claim
# depends on. An application opts in; a release build does not.
# **An application building this must also enable
# `lumen-static-widgets/observe`**, or the widgets crate refuses to compile
# (M48/T48.9): without it every widget reported `GenericContainer`.
agent = ["dep:lumen-static-agent", "dep:serde_json", "lumen-static-shell/live-agent"]
clipboard = ["dep:arboard"]
# **Images on the clipboard** (M88/T88.5, docs/plan-platform-requests.md):
# `Clipboard::set_image`/`get_image`, so an application's
# `ClipFormat::Image` read and `Clip::Image` write are answered instead
# of `Refused(Unsupported)`. Default-OFF: arboard's `image-data` pulls the
# `image` crate and its PNG stack -- by K2's method (above, at `clipboard`)
# **+12 crates** (96 -> 108), and **+321,280 B** on the stripped release
# showcase, both from docs/results-tasks.md T88.5, where the numbers live.
# A default release window links 0 `image::` symbols and a build with it
# 168 (`just clipboard-image-symbols`).
clipboard-image = ["clipboard", "arboard/image-data"]
# Platform drag and drop (T15.7). Default-OFF: it is a platform
# capability an application opts into, and winit already carries the
# events, so the feature costs no dependency — it gates the *surface*,
# not a crate. The within-application half (`lumen_static::Drag`) needs
# neither this nor a platform.
#
# **`run` and `Program` do not route drops** (M54/T54.7, R15-F5): the
# turnkey window translates no file event, so this feature only compiles
# `translate::dropped` for an application that owns its event loop.
dnd = []
# Platform file pickers (T15.11). Default-OFF, and the measurement is
# why rather than a formality: rfd costs **+10 crates** over the default
# build, against clipboard's +5 and a11y's +71 (2026-10-04, K2's method
# above; docs/results-a11y-platform.md has a11y's 95 -> 166). The
# 2026-09-07 "79" counted the whole workspace graph (218 -> 297), as the
# old "11" and "62" did. An application that never opens a file should
# not carry it.
dialogs = ["dep:rfd"]
# The GPU renderer (T15.12). Default-OFF, and the most expensive feature
# in this workspace on every axis measured: +37 crates, +6.97 MB of
# binary, and +174 MB resident once an adapter is actually opened
# (docs/results-gpu.md §6, which has the table and the method). What it
# buys is a full 4K redraw at 1.10 ms instead of 22.87.
#
# The feature only decides whether the code is *compiled in*. Whether it
# is *used* is a runtime choice with a fallback — `backend::Prefer` and
# `LUMEN_BACKEND` in the environment — because an adapter can be absent
# on a machine the binary was built for. Compiled in but unused costs
# 0.6 MB resident, so the fallback is nearly free; the price is the
# context, not the code.
gpu = ["dep:lumen-static-wgpu"]
# **The Linux tray** (M90/T90.7, docs/plan-desktop-integration.md, "The
# Linux tray is D-Bus, not GTK"): a program's `Program::tray` shown as a
# StatusNotifierItem with a dbusmenu menu, served by `ksni` 0.3 over zbus
# on a thread of its own -- no GTK, so it sits beside `dialogs`' GTK
# thread. Linux only (the dependency is target-gated; elsewhere the window
# says once on stderr that it shows no tray). Default-OFF.
#
# By K2's method (above, at `clipboard`) it costs **+55 crates** (96 ->
# 151), under `a11y`'s +71; over `a11y` it adds exactly four
# (`futures-channel`, `ksni`, `pastey`, `task-local`), since its transport
# is the zbus stack `a11y` already links. The stripped release showcase
# grows by **+3,286,360 B without `a11y`** and +1,418,240 B with it --
# against the owner's re-budgeted 3,300,000 B (2026-10-07; K2's 3 MB fired),
# docs/results-desktop-integration.md T90.7, where the numbers live.
# `scripts/check_tray_cost.sh` (crates, `just static`) and
# `scripts/check_tray_symbols.sh` (size, `just tray-symbols`) hold them.
# Smaller, both opt-in: `tray-no-tracing` below, and the three-line size
# recipe for the APPLICATION's own top-level manifest in
# book/src/platform.md, "The tray" (a library cannot ship a profile).
tray = ["dep:ksni"]
# **`tray` with every `tracing` call compiled out of the release build**
# -- **the application's own included.** It sets `tracing`'s
# `release_max_level_off`, and Cargo unifies a crate's features across the
# whole build, so this cannot be confined to zbus and ksni: choose it only
# if the application logs nothing through `tracing` in release. Saves
# about 213 KB stripped without `a11y` (223 KB with), at +0 crates over
# `tray` (docs/results-desktop-integration.md T90.7). Not part of `tray`
# for exactly that reason.
tray-no-tracing = ["tray", "dep:tracing", "tracing/release_max_level_off"]

[dependencies]
lumen-static = { path = "../lumen-static" }
lumen-static-shell = { path = "../lumen-static-shell", features = ["truetype"] }
winit = "0.30"
softbuffer = "0.4"
# The platform's file pickers (T15.11). `gtk3` rather than
# `xdg-portal`, measured 2026-09-07 over the whole workspace graph: gtk3
# 79 crates (218 -> 297) and xdg-portal 273 (218 -> 491); +10 for gtk3
# by K2's per-crate method (2026-10-04, see `dialogs`). The portal is
# dearer because the portal backend
# pulls an async runtime for a dialog this framework opens
# synchronously. Neither is cheap, which is why the feature is off.
rfd = { version = "0.15", optional = true, default-features = false, features = ["gtk3"] }
# The GPU renderer. Optional, and its own crate, which is the gate the
# M15 policy asks for: nothing pulls wgpu unless a manifest says so.
lumen-static-wgpu = { path = "../lumen-static-wgpu", optional = true }
lumen-static-agent = { path = "../lumen-static-agent", optional = true }
# M54/T54.2: the platform accessibility adapter, behind `a11y`. On Linux it
# brings accesskit_unix and a D-Bus stack (the count is in the `a11y`
# feature's comment above).
accesskit_winit = { version = "0.34", optional = true }
# Only so `a11y` can turn on the widgets' own `a11y`: the core's `a11y`
# without the widgets' does not compile (the seam, M54/T54.1), and an
# application should not have to name both.
lumen-static-widgets = { path = "../lumen-static-widgets", optional = true, default-features = false }
serde_json = { version = "1", optional = true }
# M37/T37.2: a window that rebuilds its application as a library and swaps
# to it (`hot`). The loader and its `unsafe` live in the reload crate.
lumen-static-reload = { path = "../lumen-static-reload", features = ["window"], optional = true }
notify = { version = "8", optional = true }

# The system clipboard (T14.5). `image-data` is off: this framework
# copies text and HTML (M88/T88.4), and the image feature pulls an
# image-decoding stack for a capability the default build does not have.
#
# **Not on Android** (M54/T54.8, R12-F6): arboard has no Android backend,
# so with it in the ordinary table the default features could not even
# `cargo check` for `aarch64-linux-android`. There the `clipboard`
# feature compiles the no-op `Clipboard` (see clipboard.rs).
[target.'cfg(not(target_os = "android"))'.dependencies]
arboard = { version = "3", optional = true, default-features = false }

# M90/T90.7: the Linux tray (the `tray` feature's comment has its cost).
# `default-features = false` with `blocking` and `async-io` is the plan's
# line verbatim (docs/plan-desktop-integration.md, Decisions; second
# review P15): ksni's default runtime is tokio, which is not otherwise in
# the lock, and with `async-io` its transport is the zbus stack `a11y`'s
# AT-SPI adapter already links. `tracing` is named only so
# `tray-no-tracing` can set its `release_max_level_off`; it is already in
# the graph through zbus, so it adds no crate.
[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", optional = true, default-features = false, features = ["blocking", "async-io"] }
tracing = { version = "0.1", optional = true, default-features = false }

[dev-dependencies]
# `tests/gpu_regions.rs` drives a `Host` at a device scale (M40/T40.1),
# which needs a leaf widget to change.
# `observe` since M48/T48.9: `tests/agent_transport.rs` runs a real window
# with `agent`, which turns the core's `observe` on, and the widgets crate
# refuses to build with the core's on and its own off.
lumen-static-widgets = { path = "../lumen-static-widgets", features = ["observe"] }

# M39/T39.0: the agent endpoint through a real event loop. Its own `main`,
# because winit wants the main thread; needs a display, and says so when
# it skips (see the file's header).
[[test]]
name = "agent_transport"
harness = false
required-features = ["agent"]
