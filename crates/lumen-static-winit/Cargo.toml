[package]
name = "lumen-static-winit"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "lumen_static_winit"

# The only crate in the workspace with an OS dependency. Deliberately
# *not* a feature on lumen-static-shell: the shell is the headless half
# and every test in the workspace depends on it staying that way, so
# adding winit there would put a windowing system behind `cargo test`
# (docs/plan-desktop.md T14.0).
[features]
# M27/T27.3: run the turnkey window under `Boundaries` instead of
# `Everything`. A build-time switch because `Host`'s invalidation is a
# type parameter; see `Inval` in lib.rs for why that is not a `Config`
# field. `just widget-drive` builds both, because M26 found four of five
# defects invisible under the default.
boundaries = []
# Clipboard is default-ON, unlike the a11y feature, and the difference
# is measured: arboard costs **11 crates** (207 -> 218, 2026-09-05)
# against a11y's 62 (95 -> 157). A text field without copy and paste is
# not a working text field, and a fifth of a11y's cost is worth paying
# by default. An application that wants neither writes
# `default-features = false`.
default = ["clipboard"]
# The agent endpoint: a JSON-RPC socket that drives the *running* window
# (M23/T23.1c). Default-OFF and a feature rather than always-on, because
# `lumen-static-agent` builds `lumen-static` with `observe`, which takes
# `NodeDesc` from 48 B to 72 B in every binary that links it — the
# condition `docs/step5-observability.md`'s zero-release-cost claim
# depends on. An application opts in; a release build does not.
agent = ["dep:lumen-static-agent", "dep:serde_json", "lumen-static-shell/agent"]
clipboard = ["dep:arboard"]
# Platform drag and drop (T15.7). Default-OFF: it is a platform
# capability an application opts into, and winit already carries the
# events, so the feature costs no dependency — it gates the *surface*,
# not a crate. The within-application half (`lumen_static::Drag`) needs
# neither this nor a platform.
dnd = []
# Platform file pickers (T15.11). Default-OFF, and the measurement is
# why rather than a formality: rfd costs **79 crates** (218 -> 297,
# 2026-09-07) against clipboard's 11 and a11y's 62. It is the most
# expensive optional thing in this workspace, and an application that
# never opens a file should not carry it.
dialogs = ["dep:rfd"]
# The GPU renderer (T15.12). Default-OFF, and the most expensive feature
# in this workspace on every axis measured: +37 crates, +6.97 MB of
# binary, and +174 MB resident once an adapter is actually opened
# (docs/results-gpu.md §6, which has the table and the method). What it
# buys is a full 4K redraw at 1.10 ms instead of 22.87.
#
# The feature only decides whether the code is *compiled in*. Whether it
# is *used* is a runtime choice with a fallback — `backend::Prefer` and
# `LUMEN_BACKEND` in the environment — because an adapter can be absent
# on a machine the binary was built for. Compiled in but unused costs
# 0.6 MB resident, so the fallback is nearly free; the price is the
# context, not the code.
gpu = ["dep:lumen-static-wgpu"]

[dependencies]
lumen-static = { path = "../lumen-static" }
lumen-static-shell = { path = "../lumen-static-shell", features = ["truetype"] }
winit = "0.30"
softbuffer = "0.4"
# The system clipboard (T14.5). `image-data` is off: this framework
# copies text, and the image feature pulls an image-decoding stack for
# a capability nothing here has.
arboard = { version = "3", optional = true, default-features = false }
# The platform's file pickers (T15.11). `gtk3` rather than
# `xdg-portal`, measured 2026-09-07: gtk3 costs 79 crates (218 -> 297)
# and xdg-portal costs 273 (218 -> 491), because the portal backend
# pulls an async runtime for a dialog this framework opens
# synchronously. Neither is cheap, which is why the feature is off.
rfd = { version = "0.15", optional = true, default-features = false, features = ["gtk3"] }
# The GPU renderer. Optional, and its own crate, which is the gate the
# M15 policy asks for: nothing pulls wgpu unless a manifest says so.
lumen-static-wgpu = { path = "../lumen-static-wgpu", optional = true }
lumen-static-agent = { path = "../lumen-static-agent", optional = true }
serde_json = { version = "1", optional = true }
